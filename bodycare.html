<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً  </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --pink: #D2617C;
            --dark: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Tajawal', sans-serif;
            background: var(--dark);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* خلفية سينمائية مغبشة */
        .bg-blur {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(10,10,10,0.8), rgba(210, 97, 124, 0.2)),
                        url('https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: 1;
            transform: scale(1.1);
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
        }

        /* أنيميشن التاج */
        .icon-box {
            font-size: 70px;
            color: var(--pink);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(210, 97, 124, 0.5));
            animation: crownFloat 3s ease-in-out infinite;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        h1 {
            font-size: 35px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            background: linear-gradient(to bottom, #fff 40%, var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            margin: 15px 0 40px;
            font-weight: 500;
        }

        /* زرار العودة */
        .back-home {
            text-decoration: none;
            color: white;
            background: var(--pink);
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(210, 97, 124, 0.4);
            transition: 0.3s;
        }

        .back-home:active { transform: scale(0.95); }

        /* لودر شيك تحت */
        .loading-dots {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--pink);
            border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-crown"></i>
        </div>
        
        <h1>قريباً جداً..</h1>


        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
