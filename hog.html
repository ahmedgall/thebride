<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزاتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --pink: #D2617C;
            --pink-light: #FFF5F7;
            --bg: #F8F9FD;
            --text-dark: #2D3436;
            --text-gray: #636E72;
        }

        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            direction: rtl;
            padding-bottom: 100px;
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        /* Header أصغر */
        .header {
            padding: 25px 20px 15px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            color: var(--pink);
            margin: 0;
            font-size: 20px;
            font-weight: 800;
        }

        /* قائمة الحجوزات - كروت مضغوطة */
        .bookings-list { padding: 15px; }

        .booking-card {
            background: #fff;
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
            animation: cardAppear 0.5s ease backwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .service-tag {
            background: var(--pink-light);
            color: var(--pink);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
        }

        .date-text { 
            font-size: 11px; 
            color: #A0AEC0; 
            font-weight: 600;
        }

        .item-name {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 10px;
        }

        .details-compact {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            background: #F9FAFB;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-gray);
        }

        .detail-item svg { width: 14px; height: 14px; color: var(--pink); flex-shrink: 0; }

        /* شارات الحالة أصغر */
        .status-box {
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .waiting-box { background: #FEF2EE; color: #E17055; }
        .confirmed-box { background: #E8F9F5; color: #00B894; }

        /* --- الشريط السفلي (ثابت) --- */
        .nav-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1e1e1e;
            height: 70px;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            z-index: 2000;
        }

        .nav-item {
            text-decoration: none;
            color: #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.3s;
        }

        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active { color: var(--pink); transform: translateY(-5px); }
        .active-dot { width: 5px; height: 5px; background: var(--pink); border-radius: 50%; margin-top: 3px; }

    </style>
</head>
<body>

    <div class="header">
        <h1>حجوزاتي الملكية</h1>
    </div>

    <div id="loading" style="text-align:center; padding: 50px; color: var(--pink); font-size: 14px;">
        جاري جلب البيانات...
    </div>
    
    <div id="bookings-container" class="bookings-list"></div>
    
    <div id="empty-msg" style="display:none; text-align:center; padding:100px 40px; color:#A0AEC0;">
        <p>لا توجد حجوزات حالياً</p>
    </div>

    <nav class="nav-bar">
        <a href="inde.html" class="nav-item">
            <i class="fa-solid fa-house-chimney"></i>
            <span>الرئيسية</span>
        </a>
        <a href="my-bookings.html" class="nav-item active">
            <i class="fa-solid fa-calendar-check"></i>
            <span>حجوزاتي</span>
            <div class="active-dot"></div>
        </a>
        <a href="ac.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>حسابي</span>
        </a>
    </nav>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const firebaseConfig = { projectId: "gggg-4cab7" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const userPhone = localStorage.getItem('loggedPhone')?.trim() || null;

        async function loadMyBookings() {
            if (!userPhone) {
                document.getElementById('loading').innerHTML = `يرجى تسجيل الدخول`;
                return;
            }
            try {
                const [pSnap, cSnap] = await Promise.all([
                    db.collection("pending_payments").where("customerPhone", "==", userPhone).get(),
                    db.collection("confirmed_bookings").where("customerPhone", "==", userPhone).get()
                ]);

                let all = [];
                pSnap.forEach(doc => all.push({ id: doc.id, ...doc.data(), statusKey: 'waiting' }));
                cSnap.forEach(doc => all.push({ id: doc.id, ...doc.data(), statusKey: 'confirmed' }));
                
                document.getElementById('loading').style.display = 'none';
                if (all.length === 0) { document.getElementById('empty-msg').style.display = 'block'; return; }
                
                all.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                document.getElementById('bookings-container').innerHTML = all.map(item => {
                    const isC = item.statusKey === 'confirmed';
                    const date = item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleDateString('ar-EG', {day:'numeric', month:'short'}) : 'الآن';
                    return `
                        <div class="booking-card">
                            <div class="top-row">
                                <span class="service-tag">${item.type || 'طلب'}</span>
                                <span class="date-text">${date}</span>
                            </div>
                            <div class="item-name">${item.hallName || item.partnerName || "خدمة ليلتي"}</div>
                            
                            <div class="details-compact">
                                <div class="detail-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                                    <span>${item.transferFrom || '---'}</span>
                                </div>
                                <div class="detail-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle></svg>
                                    <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.customerName || 'بدون اسم'}</span>
                                </div>
                            </div>

                            <div class="status-box ${isC ? 'confirmed-box' : 'waiting-box'}">
                                <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${isC ? '<polyline points="20 6 9 17 4 12"></polyline>' : '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>'}</svg>
                                ${isC ? 'تم التأكيد' : 'قيد المراجعة'}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) { console.error(err); }
        }
        window.onload = loadMyBookings;
    </script>
</body>
</html>
